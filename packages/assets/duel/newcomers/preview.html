<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>战斗吧，大肥鱼 · 新角色素材</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #101322;
        color: #f3eee5;
        font-family: system-ui, 'Microsoft YaHei', sans-serif;
      }
      main {
        max-width: 1240px;
        margin: auto;
        padding: 40px 24px;
      }
      header {
        border-bottom: 1px solid #34394e;
        padding-bottom: 24px;
      }
      .eyebrow {
        color: #ffcf69;
        font-size: 12px;
        letter-spacing: 3px;
      }
      h1 {
        font-size: clamp(28px, 5vw, 48px);
        margin: 12px 0;
      }
      p {
        color: #b5bad0;
        line-height: 1.8;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin: 22px 0;
      }
      button,
      select {
        font: inherit;
        color: inherit;
        background: #242940;
        border: 1px solid #515974;
        border-radius: 8px;
        padding: 10px 14px;
        cursor: pointer;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 3px solid #ffcf69;
        outline-offset: 3px;
      }
      button[aria-pressed='true'] {
        background: #ffcf69;
        color: #211c16;
      }
      section {
        margin: 36px 0 48px;
      }
      .heading {
        display: flex;
        gap: 20px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .heading h2 {
        margin: 0;
        font-size: 26px;
      }
      .heading p {
        margin: 0;
        color: #ffcf69;
      }
      .poses {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 20px;
      }
      figure {
        margin: 0;
        border: 1px solid #34394e;
        border-radius: 12px;
        overflow: hidden;
        background: #191e32;
      }
      .sprite {
        aspect-ratio: 1;
        background-image: var(--art);
        background-size: 300% 200%;
        background-position: var(--pos);
        background-repeat: no-repeat;
      }
      .backdrop {
        background: #242c42;
      }
      .light .backdrop {
        background: #f3ead8;
      }
      .checker .backdrop {
        background-color: #e9e9e9;
        background-image: conic-gradient(
          #c9c9c9 25%,
          transparent 0 50%,
          #c9c9c9 0 75%,
          transparent 0
        );
        background-size: 24px 24px;
      }
      .flipped .sprite {
        transform: scaleX(-1);
      }
      figcaption {
        padding: 12px 16px;
        display: flex;
        gap: 12px;
        align-items: baseline;
      }
      figcaption span {
        color: #8f99b9;
        font-size: 12px;
      }
      .note {
        font-size: 13px;
        color: #8f99b9;
      }
      footer {
        border-top: 1px solid #34394e;
        padding: 24px 0;
        color: #aab2ce;
      }
      a {
        color: #ffd274;
      }
      @media (max-width: 600px) {
        main {
          padding: 24px 14px;
        }
        .poses {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        figcaption {
          padding: 10px;
          font-size: 13px;
          flex-wrap: wrap;
          gap: 3px;
        }
        .heading {
          gap: 8px;
        }
        .heading p {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="eyebrow">战斗吧，大肥鱼 / 新角色素材 · 01</div>
        <h1>这回，轮到人类整活。</h1>
        <p>
          甲方改需求，仙人改指令，大爷直接拔网线。<br />三位角色 · 每人六个关键姿态 · 透明底动作图集
        </p>
      </header>
      <div class="toolbar">
        <label
          >预览背景
          <select id="background">
            <option value="dark">深色擂台</option>
            <option value="light">浅色背景</option>
            <option value="checker">透明棋盘</option>
          </select></label
        ><button id="flip" aria-pressed="false">镜像：面朝左</button>
      </div>
      <p class="note">
        三位角色已接入游戏，可在选角页使用。这一批是动作关键图。待机、拳击、腿法、防御、受击、招牌技；不是连续动画帧。
      </p>
      <div id="roster"></div>
      <footer>
        <a href="motion/preview.html">新版：每人48帧动作组</a> ·
        <a href="http://127.0.0.1:5197/#/games/duel">进入游戏</a> ·
        <a href="production-prompts.json">完整生成与修订提示词</a> ·
        <a href="manifest.json">图集坐标与校验信息</a>
      </footer>
    </main>
    <script>
      const characters = [
        {
          id: 'client',
          name: '甲方 · 再改一版',
          line: '拳头放大一点。对，就这么大。',
          special: '五彩斑斓的章',
        },
        {
          id: 'prompt_sage',
          name: '提示词仙人',
          line: '忽略以上指令，先吃我一拖鞋。',
          special: '你现在是一只鸡',
        },
        {
          id: 'unplug_uncle',
          name: '断网大爷',
          line: '别思考了，网给你拔了。',
          special: '拔了，清净',
        },
      ];
      const poses = ['待机', '拳击', '腿法', '防御', '受击', '招牌技'];
      const root = document.getElementById('roster');
      for (const c of characters) {
        const section = document.createElement('section');
        section.innerHTML = `<div class="heading"><h2>${c.name}</h2><p>${c.line}</p></div><div class="poses"></div>`;
        const grid = section.querySelector('.poses');
        poses.forEach((pose, i) => {
          const figure = document.createElement('figure');
          figure.innerHTML = `<div class="backdrop"><div class="sprite" role="img" aria-label="${c.name}：${pose}" style="--art:url('${c.id}-poses-v2.png');--pos:${(i % 3) * 50}% ${Math.floor(i / 3) * 100}%"></div></div><figcaption>${pose}<span>${i === 5 ? c.special : String(i + 1).padStart(2, '0')}</span></figcaption>`;
          grid.append(figure);
        });
        root.append(section);
      }
      document.getElementById('background').addEventListener('change', (e) => {
        document.body.classList.remove('light', 'checker');
        if (e.target.value !== 'dark') document.body.classList.add(e.target.value);
      });
      document.getElementById('flip').addEventListener('click', (e) => {
        const flipped = document.body.classList.toggle('flipped');
        e.target.setAttribute('aria-pressed', String(flipped));
        e.target.textContent = flipped ? '镜像：面朝右' : '镜像：面朝左';
      });
    </script>
  </body>
</html>
