  <main>
    <h1>跑动、起手、发力、收招。</h1>
    <p class="note">
      三名角色 × 六组动作 × 四帧，共 72 个新动作帧。下方按运行时锚点播放，人物 PNG
      原图未改写。攻击动作在游戏中由实际起手、命中和收招时序驱动。
    </p>
    <div class="tools">
      <select id="character" aria-label="角色">
        <option value="deepseek">DeepSeek</option>
        <option value="gpt">GPT</option>
        <option value="doubao">豆包</option></select
      ><select id="group" aria-label="动作组">
        <option value="0">跑动循环</option>
        <option value="1">第一拳</option>
        <option value="2">第二拳</option>
        <option value="3">踢击</option>
        <option value="4">挑空</option>
        <option value="5">受击与起身</option></select
      ><button id="play">暂停预览</button><button id="next">下一帧</button
      ><button id="bg">切换深浅底</button><a href="motion-prompts.json">完整实际提示词</a>
    </div>
    <div id="player" class="player"></div>
    <p id="label"></p>
    <div id="gallery"></div>
    <p class="note">
      下蹲与蹲拳另有独立素材，扫堂腿另有图集；局内按 N / P2 句号使用腿法。<a
        href="combat/crouch/README.md"
        >下蹲与腿法说明</a
      >
      · <a href="combat-preview.html">前批关键姿态</a>
    </p>

      rows = ['跑动循环', '第一拳', '第二拳', '踢击', '挑空', '受击与起身'];
    let character = 'deepseek',
      row = 0,
      frame = 0,
      playing = true,
      last = 0;
    function svg(char, index) {
      const g = geometry[char][index],
        a = assets.find((a) => a.id === char);
      return (
        '<svg viewBox="-140 -170 280 190"><path d="M-140 0H140M0-155V10" stroke="#7494ad" stroke-width=".6"/><svg x="' +
        g.x +
        '" y="' +
        g.y +
        '" width="' +
        g.width +
        '" height="' +
        g.height +
        '" viewBox="' +
        g.viewBox +
        '"><image href="' +
        a.path +
        '" width="' +
        g.sourceWidth +
        '" height="' +
        g.sourceHeight +
        '"/></svg></svg>'
      );
    }
    function update() {
      document.querySelector('#player').innerHTML = svg(character, row * 4 + frame);
      document.querySelector('#label').textContent =
        character + ' · ' + rows[row] + ' · 帧 ' + (frame + 1) + '/4';
    }
    function gallery() {
      document.querySelector('#gallery').innerHTML = rows
        .map(
          (name, r) =>
            '<h2>' +
            name +
            '</h2><div class="grid">' +
            [0, 1, 2, 3]
              .map(
                (f) =>
                  '<div class="card">' +
                  svg(character, r * 4 + f) +
                  '<p>' +
                  name +
                  ' · ' +
                  (f + 1) +
                  '</p></div>',
              )
              .join('') +
            '</div>',
        )
        .join('');
    }
    document.querySelector('#character').onchange = (e) => {
      character = e.target.value;
      gallery();
      update();
    };
    document.querySelector('#group').onchange = (e) => {
      row = Number(e.target.value);
      frame = 0;
      update();
    };
    document.querySelector('#play').onclick = () => {
      playing = !playing;
      document.querySelector('#play').textContent = playing ? '暂停预览' : '播放预览';
    };
    document.querySelector('#next').onclick = () => {
      playing = false;
      document.querySelector('#play').textContent = '播放预览';
      frame = (frame + 1) % 4;
      update();
    };
    document.querySelector('#bg').onclick = () => document.body.classList.toggle('light');
    function tick(t) {
      if (playing && t - last > 180) {
        last = t;
        frame = (frame + 1) % 4;
        update();
      }
      requestAnimationFrame(tick);
    }
    gallery();
    update();
    requestAnimationFrame(tick);
  </script>
