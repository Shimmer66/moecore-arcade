      const gallery = document.querySelector('#gallery'),
        viewer = document.querySelector('#viewer');
      let active = 0,
        filter = 'all';
      const visible = () =>
        assets.filter(
          (a) =>
            filter === 'all' ||
            (filter === 'effects'
              ? a.action === 'effect'
              : a.character === filter && a.action !== 'effect'),
        );
      function show(index) {
        const list = visible();
        active = (index + list.length) % list.length;
        const a = list[active];
        document.querySelector('#zoom-image').src = a.path;
        document.querySelector('#zoom-image').alt = a.label;
        document.querySelector('#zoom-title').textContent =
          a.label + ' · ' + (active + 1) + ' / ' + list.length;
        if (!viewer.open) viewer.showModal();
      }
      for (const [id, name] of [
        ['deepseek', 'DeepSeek / 鲸娘出拳'],
        ['doubao', '豆包 / 直白出手'],
        ['effects', '独立特效 / 命中才出场'],
      ]) {
        const section = document.createElement('section');
        section.dataset.group = id;
        const heading = document.createElement('h2');
        heading.textContent = name;
        const grid = document.createElement('div');
        grid.className = 'grid';
        for (const a of assets.filter((a) =>
          id === 'effects' ? a.action === 'effect' : a.character === id && a.action !== 'effect',
        )) {
          const card = document.createElement('article');
          card.className = 'card';
          const btn = document.createElement('button');
          btn.className = 'image';
          btn.setAttribute('aria-label', '放大：' + a.label);
          const img = document.createElement('img');
          img.src = a.path;
          img.alt = a.label;
          img.loading = 'lazy';
          btn.append(img);
          btn.onclick = () => show(visible().findIndex((x) => x.id === a.id));
          const info = document.createElement('div');
          info.className = 'info';
          const title = document.createElement('h3');
          title.textContent = a.label;
          const meta = document.createElement('small');
          meta.textContent =
            a.width + ' × ' + a.height + ' · ' + (a.bytes / 1048576).toFixed(2) + ' MB';
          const file = document.createElement('small');
          file.textContent = a.path.split('/').pop();
          const link = document.createElement('a');
          link.href = a.path;
          link.download = a.id + '.png';
          link.textContent = '下载原图 ↓';
          info.append(title, meta, file, link);
          card.append(btn, info);
          grid.append(card);
        }
        section.append(heading, grid);
        gallery.append(section);
      }
      document.querySelectorAll('button[data-group]').forEach(
        (b) =>
          (b.onclick = () => {
            filter = b.dataset.group;
            document
              .querySelectorAll('button[data-group]')
              .forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
            document
              .querySelectorAll('section[data-group]')
              .forEach((s) => (s.hidden = filter !== 'all' && s.dataset.group !== filter));
          }),
      );
      document.querySelectorAll('button[data-bg]').forEach(
        (b) =>
          (b.onclick = () => {
            document.body.dataset.bg = b.dataset.bg;
            document
              .querySelectorAll('button[data-bg]')
              .forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
          }),
      );
      document.querySelector('#previous').onclick = () => show(active - 1);
      document.querySelector('#next').onclick = () => show(active + 1);
      document.querySelector('#close').onclick = () => viewer.close();
      viewer.onkeydown = (e) => {
        if (e.key === 'ArrowLeft') show(active - 1);
        if (e.key === 'ArrowRight') show(active + 1);
      };
