        }),
      );
      const viewer = document.querySelector('#viewer');
      let active = 0;
      function show(index) {
        active = (index + assets.length) % assets.length;
        const a = assets[active];
        document.querySelector('#zoom-image').src = a.path;
        document.querySelector('#zoom-image').alt = a.label;
        document.querySelector('#zoom-title').textContent = a.label;
        if (!viewer.open) viewer.showModal();
      }
      document.querySelector('#close').onclick = () => viewer.close();
      document.querySelector('#previous').onclick = () => show(active - 1);
      document.querySelector('#next').onclick = () => show(active + 1);
      viewer.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') show(active - 1);
        if (e.key === 'ArrowRight') show(active + 1);
      });
      document.querySelectorAll('[data-collection]').forEach((button) => {
        if (button.tagName !== 'BUTTON') return;
        button.addEventListener('click', () => {
          document.body.dataset.collection = button.dataset.collection;
          document
            .querySelectorAll('button[data-collection]')
            .forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
        });
      });
    </script>
  </body>
</html>
